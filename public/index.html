<!doctype html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Магазин</title>
		<link rel="stylesheet" href="./styles.css">
	</head>
	<body class="min-h-screen bg-base-200">
		<header class="navbar flex-wrap gap-3 bg-base-100 px-4 shadow-sm">
			<a class="text-xl font-bold" href="/">Магазин</a>

			<div role="tablist" class="tabs tabs-box tabs-sm">
				<button role="tab" class="tab" data-view="catalog">Каталог</button>
				<button role="tab" class="tab" data-view="orders">Мои заказы</button>
			</div>

			<div class="ml-auto flex items-center gap-2">
				<select
					id="user-select"
					class="select select-sm w-48"
					aria-label="Покупатель"
				></select>
			</div>
		</header>

		<main class="mx-auto max-w-6xl p-4">
			<section id="catalog-view" class="grid gap-6 lg:grid-cols-[1fr_20rem]">
				<div class="flex flex-col gap-4">
					<form id="search-form" class="join w-full">
						<input
							id="search-input"
							class="input join-item w-full"
							type="search"
							placeholder="Поиск по названию"
							maxlength="100"
						>
						<button class="btn btn-neutral join-item">Найти</button>
					</form>

					<div
						id="products"
						class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3"
					></div>
				</div>

				<aside class="card card-border h-fit bg-base-100 lg:sticky lg:top-4">
					<div class="card-body gap-3">
						<h2 class="card-title">Корзина</h2>
						<p id="cart-empty" class="text-base-content/60">
							Добавьте товары из каталога
						</p>
						<ul id="cart-lines" class="flex flex-col gap-2"></ul>
						<div
							class="flex justify-between border-t border-base-300 pt-3 font-semibold"
						>
							<span>Итого</span>
							<span id="cart-total"></span>
						</div>
						<button id="checkout" class="btn btn-primary" disabled>
							Оформить заказ
						</button>
					</div>
				</aside>
			</section>

			<section id="orders-view" class="flex flex-col gap-4" hidden>
				<div
					class="stats stats-vertical bg-base-100 shadow-sm sm:stats-horizontal"
				>
					<div class="stat">
						<div class="stat-title">Ответ сервера</div>
						<div id="orders-duration" class="stat-value text-3xl">—</div>
						<div class="stat-desc">GET /api/orders</div>
					</div>
					<div class="stat">
						<div class="stat-title">Заказов всего</div>
						<div id="orders-count" class="stat-value text-3xl">—</div>
						<div class="stat-desc">за всё время</div>
					</div>
					<div class="stat">
						<div class="stat-title">Потрачено</div>
						<div id="orders-spent" class="stat-value text-3xl">—</div>
						<div class="stat-desc">сумма всех заказов</div>
					</div>
				</div>

				<div class="flex flex-wrap items-center justify-between gap-2">
					<div class="join">
						<button
							class="btn btn-sm join-item"
							aria-label="Первая страница"
							data-page="first"
						>
							«
						</button>
						<button
							class="btn btn-sm join-item"
							aria-label="Предыдущая страница"
							data-page="previous"
						>
							‹
						</button>
						<span
							id="orders-page"
							class="btn btn-sm join-item pointer-events-none"
						>
							Страница 1
						</span>
						<button
							class="btn btn-sm join-item"
							aria-label="Следующая страница"
							data-page="next"
						>
							›
						</button>
						<button
							class="btn btn-sm join-item"
							aria-label="Последняя страница"
							data-page="last"
						>
							»
						</button>
					</div>
					<button id="orders-refresh" class="btn btn-sm">Обновить</button>
				</div>

				<div id="orders" class="flex flex-col gap-2"></div>
			</section>
		</main>

		<div id="toasts" class="toast toast-end"></div>

		<template id="product-template">
			<article class="card card-border bg-base-100">
				<div class="card-body">
					<h3 class="card-title text-base" data-field="title"></h3>
					<p class="text-lg font-semibold" data-field="price"></p>
					<div class="card-actions items-center justify-between">
						<span class="badge badge-soft" data-field="stock"></span>
						<button class="btn btn-primary btn-sm" data-action="add">
							В корзину
						</button>
					</div>
				</div>
			</article>
		</template>

		<template id="cart-line-template">
			<li class="flex items-center gap-2">
				<span class="flex-1 truncate" data-field="title"></span>
				<input
					class="input input-sm w-16"
					type="number"
					min="1"
					max="10"
					aria-label="Количество"
					data-field="quantity"
				>
				<button
					class="btn btn-ghost btn-sm btn-square"
					aria-label="Убрать из корзины"
					data-action="remove"
				>
					✕
				</button>
			</li>
		</template>

		<template id="order-template">
			<details
				class="collapse collapse-arrow border border-base-300 bg-base-100"
			>
				<summary class="collapse-title flex flex-wrap items-center gap-3">
					<span class="font-semibold" data-field="number"></span>
					<span class="text-base-content/60" data-field="date"></span>
					<span class="badge badge-sm badge-soft" data-field="status"></span>
					<span class="ml-auto font-semibold" data-field="total"></span>
				</summary>
				<div class="collapse-content">
					<table class="table table-sm">
						<thead>
							<tr>
								<th>Товар</th>
								<th class="text-right">Количество</th>
								<th class="text-right">Цена</th>
							</tr>
						</thead>
						<tbody data-field="items"></tbody>
					</table>
				</div>
			</details>
		</template>

		<template id="order-item-template">
			<tr>
				<td data-field="title"></td>
				<td class="text-right" data-field="quantity"></td>
				<td class="text-right" data-field="price"></td>
			</tr>
		</template>

		<script type="module" src="./app.ts"></script>
	</body>
</html>
