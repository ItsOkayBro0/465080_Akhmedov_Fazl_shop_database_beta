services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://shop:shop@db:5432/shop
    ports:
      - "127.0.0.1:3000:3000"
    command: ["sh", "-c", "bun run db:seed && bun run db:migrate && bun run start"]
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/api/products'); process.exit(response.ok ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  db_data:
